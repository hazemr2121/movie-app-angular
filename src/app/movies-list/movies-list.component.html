<!-- * Search -->
<div class="container-fluid px-3 px-md-4 mt-3">
  <div class="hero bg-body-secondary rounded-3 p-3 p-md-5">
    <h2 class="fw-bold">Welcome to our movie app</h2>
    <p class="mb-3">Millions of movies, TV shows and people to discover. Explore now.</p>
    <div class="d-flex gap-2">
      <input
        #searchInput
        class="form-control search-input"
        placeholder="Search and explore...."
        type="search"
        inputmode="search"
        enterkeyhint="search"
        autocomplete="off"
        aria-label="Search movies"
        [(ngModel)]="query"
        (keyup.enter)="searchMovies(query); searchInput.blur()"
      />
      <button class="btn btn-warning search-btn" (click)="searchMovies(query)">
        Search
      </button>
    </div>
  </div>
</div>

@if (search) {
<h3 class="list-heading fw-bold">Search Results: {{ current }}</h3>
} @else {
<h3 class="list-heading fw-bold">Now Playing</h3>
}

<!-- * Shows movie cards -->
<div class="container-fluid px-3 px-md-4">
  <div class="row g-3 justify-content-center">
    @if (nowPlaying) {
    @for (movie of nowPlaying; track movie.id) {
    <app-movie-card
      class="col-6 col-sm-4 col-md-3 col-lg-2"
      [movie]="movie"
    ></app-movie-card>
    }
    } @else {
    <!-- Same size as real cards, so nothing jumps when the data arrives -->
    @for (i of skeletons; track i) {
    <div class="col-6 col-sm-4 col-md-3 col-lg-2" aria-hidden="true">
      <div class="skeleton poster rounded-3"></div>
      <div class="skeleton skeleton-line mt-2"></div>
      <div class="skeleton skeleton-line skeleton-line--short mt-1"></div>
    </div>
    }
    }
  </div>
</div>

<!-- * Pagination -->
<nav aria-label="Pages">
  <ul class="pagination pager justify-content-center">
    <li class="page-item" [class.disabled]="page <= 1">
      <button
        type="button"
        class="page-link"
        aria-label="Previous page"
        [disabled]="page <= 1"
        (click)="prevPage()"
      >
        <span aria-hidden="true">&laquo;</span>
      </button>
    </li>

    <li class="page-item">
      <span class="page-link current" aria-current="page">{{ page }}</span>
    </li>

    <li class="page-item">
      <button
        type="button"
        class="page-link"
        aria-label="Next page"
        (click)="nextPage()"
      >
        <span aria-hidden="true">&raquo;</span>
      </button>
    </li>
  </ul>
</nav>
