@let wishlistCount = wishlistService.getWishlistCount() | async;
<nav class="app-nav">
  <div class="app-nav__inner">
    <a class="brand" routerLink="">Movie App</a>
    <div class="nav-actions">
      <div class="dropdown">
        <button
          type="button"
          class="nav-btn dropdown-toggle"
          id="languageDropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          [attr.aria-label]="'Language: ' + (currentLanguge | uppercase)"
        >
          {{ currentLanguge | uppercase }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
          @for(lang of availiableLang; track $index){
          <li>
            <button
              type="button"
              class="dropdown-item"
              [class.active]="lang === currentLanguge"
              (click)="changeLang(lang)"
            >
              {{ lang | uppercase }}
            </button>
          </li>
          }
        </ul>
      </div>
      <a
        class="nav-btn"
        routerLink="wishlist"
        [attr.aria-label]="'Watchlist, ' + wishlistCount + ' movies'"
      >
        <i class="bi bi-heart-fill fs-4" aria-hidden="true"></i>
        <span class="d-none d-sm-inline">Watchlist</span>
        <span class="count-badge">{{ wishlistCount }}</span>
      </a>
    </div>
  </div>
</nav>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
